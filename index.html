b=`<div class=row2 style="max-width:520px;margin-bottom:14px"><select data-i=hp>${L.map(x=>`<option value=${x.id} ${x.id==p.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><form data-f=price data-id=${p.id} style="display:flex;gap:6px"><input type=number name=price min=30 value=${p.price} aria-label="Nightly price" style="width:100%;border:1px solid var(--ln);border-radius:6px;padding:6px;background:var(--sf)"><button class="btn s">Update price</button></form></div><div class=sh style="max-width:520px"><button class="btn o s" data-a=cm data-n=-1 ${o<=0?'disabled':''}>Prev</button><b>${d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button class="btn o s" data-a=cm data-n=1>Next</button></div><div class=cal>${cells.join('')}</div><p class=sub style="margin-top:10px">Click a date to block or unblock it. Dark = blocked, terracotta = reserved.</p>`}}
if(t=='rs')b=`<h2 style="margin-bottom:14px">Reservations</h2>${hr.map(r=>rcard(r,1)).join('')||'<div class=empty>No reservations yet.</div>'}`;if(t=='msgs')b=msgs('host');
return`<div class=w style="padding-top:24px"><h1 style="font-size:38px">Host dashboard</h1><p class=sub>Jordan Bennett (fictional demo host). All figures are simulated.</p>${tabs([['ov','Overview'],['ls','Listings'],['cal','Calendar'],['rs','Reservations'],['msgs','Messages']],t)}${b}</div>`}
function modal(){if(!M)return'';const X='<button class=x data-a=x aria-label=Close>×</button>';
if(M.t=='lb'){const p=P(M.id);return`<div class=lb role=dialog aria-label="Photo viewer"><img src="${img(p,M.j)}" alt="${esc(p.title)} photo ${M.j+1}"><button style="left:16px" data-a=lbn data-n=-1 aria-label=Previous>‹</button><button style="right:16px" data-a=lbn data-n=1 aria-label=Next>›</button><button style="top:16px;right:16px" data-a=x aria-label=Close>×</button></div>`}
let h='';if(M.t=='demo')h=`<h2>Explore the Roamly demo</h2><p class=sub style="margin-top:6px">No sign-up needed. You'll use a fictional demo profile and simulated data.</p><div class=dm2><div class=opt><h3>Explore as a Guest</h3><p>Discover stays, save wishlists, make simulated reservations, manage trips and message hosts as Alex Morgan.</p><button class=btn data-a=role data-r=guest>Enter as guest</button></div><div class=opt><h3>Explore as a Host</h3><p>Manage listings, availability, reservations and simulated earnings as Jordan Bennett.</p><button class=btn data-a=role data-r=host>Enter as host</button></div></div>`;

if(M.t=='conf')h=`<h2>${M.title}</h2><p class=sub style="margin:10px 0 18px">${M.body}</p><div class=acts><button class=btn data-a=${M.go} data-ref="${M.ref||''}">${M.ok}</button><button class="btn o" data-a=x>Keep as is</button></div>`;

if(M.t=='form'){const p=M.id?P(M.id):{title:'',city:'Lisbon',country:'Portugal',type:'Design',price:150,bd:1,desc:'',hue:20,am:[]};h=`<h2>${M.id?'Edit listing':'Create listing'}</h2><form class=f data-f=lst data-id="${M.id||''}"><label>Title<input name=title required value="${esc(p.title)}"></label><div class=row2><label>City<input name=city required value="${esc(p.city)}"></label><label>Country<input name=country required value="${esc(p.country||'')}"></label></div><div class=row2><label>Category<select name=type>${TYPES.map(c=>`<option ${c==p.type?'selected':''}>${c}</option>`).join('')}</select></label></div><div class=row2><label>Nightly price ($)<input type=number name=price min=30 max=3000 required value=${p.price}></label><label>Bedrooms<input type=number name=bd min=1 max=8 value=${p.bd}></label></div><label>Description<textarea name=desc rows=3>${esc(p.desc)}</textarea></label><label>Cover photo style<br>${[20,110,200,260,330,160].map(x=>`<label class=sw><input type=radio name=hue value=${x} ${Math.abs(p.hue-x)<30||x==20&&!M.id?'checked':''}><span style="background:hsl(${x},60%,75%)"></span></label>`).join('')}</label><label>Amenities<br>${AMS.map(a=>`<label style="display:inline-flex;gap:4px;margin-right:12px"><input type=checkbox name=am value="${a}" style="width:auto" ${p.am.includes(a)?'checked':''}>${a}</label>`).join('')}</label><button class=btn style="width:100%">Save listing</button></form>`}

const VIEWS={home,search,prop,checkout,done,trips,host};

function toast(s){const d=document.createElement('div');d.textContent=s;$('#t').append(d);setTimeout(()=>d.remove(),2600)}
function setRole(r){db.role=r;save();toast('Demo mode: '+(r=='host'?'Host':'Guest'));r=='host'?go('host',{tab:'ov'}):go('trips',{tab:'trips'})}
const A={demo(){M={t:'demo'};menu=false;render()},x(){M=null;render()},bg(d,t,e){if(e.target==t)A.x()},go(d){go(d.v)},role(d){setRole(d.r)},menu(){menu=!menu;render()},exit(){db.role=null;save();go('home')},
nav(d){const v=d.v;if(v=='help'){M={t:'help'};render()}else if(v=='demo')A.demo();else if(v=='cats'){go('home');setTimeout(()=>$('#cats').scrollIntoView(),30)}else if(v.includes(':')){const[a,b]=v.split(':');go(a,{tab:b})}else go(v)},
open(d){go('prop',{id:d.id})},fav(d){const i=db.saved.indexOf(d.id);i<0?db.saved.push(d.id):db.saved.splice(i,1);save();document.querySelectorAll('.fav[data-id="'+d.id+'"]').forEach(b=>b.classList.toggle('on',i<0));toast(i<0?'Saved to wishlist':'Removed from wishlist');if(V.v=='trips'&&V.p.tab=='saved')render()},
cat(d){db.crit={...DC,types:[d.t]};save();go('search')},dest(d){db.crit={...DC,q:d.c};save();go('search')},pre(d){db.crit={...DC,...PRE[d.i]};save();go('search')},
filt(){fo=!fo;render()},clr(){db.crit={...DC};save();render()},rm(d){const c=db.crit,k=d.k;if(k=='types'||k=='am')c[k]=c[k].filter(x=>x!=d.v);else if(k=='dates'){c.in='';c.out=''}else c[k]=DC[k];save();render()},
tab(d){V.p.tab=d.t;render()},th(d){V.p.th=d.id;render()},cm(d){V.p.cm=(V.p.cm||0)+ +d.n;render()},
lb(d){M={t:'lb',id:d.id,j:+d.j};render()},lbn(d){M.j=(M.j+ +d.n+4)%4;render()},
reserve(d){if(!db.role){db.role='guest';toast('Entered guest demo as Alex Morgan')}else if(db.role=='host'){db.role='guest';toast('Switched to guest demo to book')}save();go('checkout',{id:d.id})},
pay(d){if(!$('#agree').checked){toast('Please confirm you understand this is simulated');return}const p=P(d.id),c=db.crit,n=nts(c.in,c.out);if(!avail(p,c.in,c.out)){toast('Those dates are no longer available');return}const ref='RML-'+Math.random().toString(36).slice(2,8).toUpperCase();db.res.push({ref,pid:p.id,in:c.in,out:c.out,g:c.g,st:p.own?'pending':'confirmed',guest:db.prof.name,total:cost(p,n).total});save();go('done',{ref})},
det(d){M={t:'det',ref:d.ref};render()},cx(d){M={t:'conf',title:'Cancel this simulated trip?',body:'The demo reservation will be marked as cancelled.',ok:'Cancel trip',go:'cxdo',ref:d.ref};render()},cxdo(d){db.res.find(r=>r.ref==d.ref).st='cancelled';save();M=null;toast('Trip cancelled');render()},

blk(d){const p=P(V.p.hp)||mine()[0],i=p.blocked.indexOf(d.d);i<0?p.blocked.push(d.d):p.blocked.splice(i,1);save();render()},
newl(){M={t:'form'};render()},edl(d){M={t:'form',id:d.id};render()},

search(){}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!A[t.dataset.a])return;A[t.dataset.a](t.dataset,t,e)});
