<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#26231f"><title>Roamly: Discover your next favorite place</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--sf:#fff;--ink:#26231f;--mu:#6f675e;--ln:#e6dfd4;--ac:#b4533a;--ah:#9a432d;--rb:#f6e6df;--sh:rgba(38,35,31,.16);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171513;--sf:#201d1a;--ink:#f2ede5;--mu:#a39a8e;--ln:#38332d;--ac:#d9775c;--ah:#e98d73;--rb:#3b2b25;--sh:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme=dark]{--bg:#171513;--sf:#201d1a;--ink:#f2ede5;--mu:#a39a8e;--ln:#38332d;--ac:#d9775c;--ah:#e98d73;--rb:#3b2b25;--sh:rgba(0,0,0,.55);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.015em}
h1{font-size:clamp(34px,5.4vw,60px);line-height:1.05}h2{font-size:clamp(22px,3vw,30px)}h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;max-width:1180px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-size:23px;background:none;border:0}
.links{display:flex;gap:20px;flex:1;margin-left:16px}.links button{background:none;border:0;color:var(--mu);padding:4px 0;white-space:nowrap}.links button:hover{color:var(--ink)}
@media(max-width:760px){.links{order:3;width:100%;margin:0;overflow-x:auto}.bar{gap:10px}}
.btn{background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:6px;padding:10px 18px;font-weight:500}.btn:hover{background:var(--ah)}
.btn.o{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.o:hover{background:var(--ink);color:var(--bg)}.btn.s{padding:6px 12px;font-size:13px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{font-size:12px;border:1px solid var(--ac);color:var(--ac);border-radius:99px;padding:2px 10px}
.dm{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding:5px 12px}
.acc{position:relative}.me{display:flex;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 12px 4px 4px}
.av{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.menu{position:absolute;right:0;top:46px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;min-width:230px;padding:8px;z-index:70}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:5px}.menu button:hover{background:var(--bg)}.menu p{padding:6px 10px;color:var(--mu);font-size:13px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding:56px 0 24px}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:28px}}
.hero p.l{color:var(--mu);font-size:18px;max-width:46ch;margin:16px 0 24px}.acts{display:flex;gap:12px;flex-wrap:wrap}
.hi{position:relative}.hi img{width:100%;aspect-ratio:4/3.3;object-fit:cover;border-radius:6px;display:block}.hi .i2{position:absolute;width:42%;aspect-ratio:1;left:-8%;bottom:-8%;border:6px solid var(--bg);object-fit:cover;border-radius:6px}
section.s{padding:36px 0}.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:12px}.lk{background:none;border:0;color:var(--ac);font-weight:500;text-decoration:underline}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{cursor:pointer}.im{position:relative;aspect-ratio:1/.92;overflow:hidden;border-radius:6px;background:var(--ln)}.im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.card:hover img{transform:scale(1.04)}
.fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#8a8178;font-size:16px}.fav.on{color:var(--ac)}.hf .fav{position:static;border:1px solid var(--ln);background:var(--sf)}
.cm{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.cm span{white-space:nowrap}.sub{color:var(--mu);font-size:14px}
.dest{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;aspect-ratio:1/1.1;display:block;width:100%;border:0;padding:0}.dest img{width:100%;height:100%;object-fit:cover}.dest span{position:absolute;left:12px;bottom:10px;color:#fff;text-align:left;font-family:Fraunces,serif;font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:6px 14px;font-size:14px}.chip.on{border-color:var(--ink)}
.sl{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:24px 0}@media(max-width:900px){.sl{grid-template-columns:1fr}.fl{display:none}.fl.o{display:block}}
.fl label.c{display:flex;gap:8px;align-items:center;margin:4px 0}.fl h3{font-size:15px;margin:18px 0 6px;font-family:Inter;font-weight:600}.fl input[type=number],.fl select,.f input,.f select,.f textarea,.bp input,.bp select,.pf input,.pf textarea{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:8px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--ln);border-radius:8px;color:var(--mu)}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px;gap:8px;border-radius:8px;overflow:hidden;margin:20px 0;position:relative}.gal img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.gal img:first-child{grid-row:1/3}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-template-rows:200px 120px}.gal img:first-child{grid-column:1/3;grid-row:1}.gal img:nth-child(n+4){display:none}}
.pd{display:grid;grid-template-columns:1fr 360px;gap:48px;padding-bottom:40px}@media(max-width:960px){.pd{grid-template-columns:1fr}}
.pd section{padding:22px 0;border-top:1px solid var(--ln)}.am{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bp{position:sticky;top:90px;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:20px;align-self:start}
.er{color:#b3261e;font-size:14px;margin:8px 0}.ln{display:flex;justify-content:space-between;margin:6px 0}.tot{border-top:1px solid var(--ln);padding-top:10px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);overflow-x:auto;margin:24px 0}.tabs button{background:none;border:0;padding:10px 14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--ink);border-color:var(--ac)}
.rc{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:12px;margin-bottom:12px}.rc img{width:96px;height:80px;object-fit:cover;border-radius:5px}
@media(max-width:620px){.rc{grid-template-columns:72px 1fr}.rc>div:last-child{grid-column:1/3}.rc img{width:72px;height:64px}}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:16px}.stat b{font:500 28px Fraunces,serif;display:block}
.msg{display:grid;grid-template-columns:250px 1fr;border:1px solid var(--ln);background:var(--sf);border-radius:8px;min-height:380px}@media(max-width:700px){.msg{grid-template-columns:1fr}}
.th{border-right:1px solid var(--ln)}.th button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:12px}.th button.on{background:var(--bg)}
.cv{display:flex;flex-direction:column;padding:14px}.bub{max-width:80%;padding:8px 12px;border-radius:12px;margin:4px 0;background:var(--bg)}.bub.me2{align-self:flex-end;background:var(--ac);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:520px}.cal button,.cal div{aspect-ratio:1;border:1px solid var(--ln);background:var(--sf);border-radius:5px;font-size:13px}.cal .b{background:var(--ink);color:var(--bg)}.cal .r{background:var(--ac);color:#fff}.cal [disabled]{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(20,16,12,.55);z-index:80;display:grid;place-items:center;padding:16px;overflow:auto}.md{background:var(--bg);border-radius:10px;max-width:640px;width:100%;padding:28px;position:relative;max-height:92vh;overflow:auto}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:26px}
.dm2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}@media(max-width:560px){.dm2{grid-template-columns:1fr}}
.opt{border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}.opt p{color:var(--mu);font-size:14px;flex:1}
.lb{position:fixed;inset:0;background:#0d0b09;z-index:90;display:flex;align-items:center;justify-content:center}.lb img{max-width:92vw;max-height:84vh;border-radius:4px}.lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px}
.f label{display:block;margin:10px 0;font-size:13px;color:var(--mu)}.sw{display:inline-flex;margin:4px 8px 4px 0}.sw input{position:absolute;opacity:0}.sw span{width:44px;height:34px;border-radius:5px;border:2px solid transparent}.sw input:checked+span{border-color:var(--ink)}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:6px}#t div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px}
footer{border-top:1px solid var(--ln);padding:44px 0 24px;color:var(--mu);font-size:14px;margin-top:40px}.ftg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}.ftg h4{font:600 14px Inter,sans-serif;color:var(--ink);margin-bottom:10px}.ftg nav button{display:block;background:none;border:0;padding:4px 0;color:var(--mu);text-align:left}.ftg nav button:hover,.ftb a:hover,.ftl a:hover{color:var(--ink)}.ftb p{max-width:34ch;margin-top:10px}.ftl{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;border-top:1px solid var(--ln);margin-top:32px;padding-top:18px;font-size:13px}.ftl a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}.ftn{margin-top:10px;font-size:12px}@media(max-width:760px){.ftg{grid-template-columns:1fr 1fr}.ftb{grid-column:1/3}.ftl{flex-direction:column}}
.ok{background:#e7f3ea;color:#1d5a2f;padding:14px;border-radius:8px;margin-bottom:16px}.bars rect{fill:var(--ac)}.bars text{fill:var(--mu);font-size:11px}
/* ===== Polish layer: motion + custom controls ===== */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes mdIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes heart{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes mL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes mR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes selPop{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:none}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes uline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}30%{opacity:1;transform:translate(calc(var(--x)*.7),-110px) rotate(calc(var(--r)*.4))}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

input[type=checkbox],input[type=radio]{accent-color:var(--ac)}
input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.f input,.fl input,.bp input,.pf input,.f textarea,.pf textarea{transition:border-color .2s,box-shadow .2s}
.f input:focus,.fl input:focus,.bp input:focus,.pf input:focus,.f textarea:focus,.pf textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(180,83,58,.16)}

/* header */
#hd{transition:box-shadow .3s}#hd.sc{box-shadow:0 10px 26px -18px var(--sh)}
.logo svg{transition:transform .45s var(--ease)}.logo:hover svg{transform:rotate(-14deg) scale(1.12)}
.links button{position:relative;transition:color .2s}.links button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}.links button:hover::after{transform:scaleX(1)}
.menu{animation:popIn .18s var(--ease);transform-origin:top right;box-shadow:0 20px 40px -18px var(--sh)}
.me{transition:box-shadow .2s,border-color .2s}.me:hover{border-color:var(--ink);box-shadow:0 6px 16px -10px var(--sh)}

/* buttons */
.btn{transition:background .2s,color .2s,transform .15s,box-shadow .25s,border-color .2s}
.btn:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 10px 20px -10px var(--ac)}
.btn.o:hover:not([disabled]){box-shadow:0 10px 20px -12px var(--sh)}
.btn:active:not([disabled]){transform:scale(.97);box-shadow:none}
.lk{transition:opacity .2s}.lk:hover{opacity:.75}.lk[disabled]{opacity:.35;cursor:not-allowed;text-decoration:none}

/* page + hero entrances */
#app[data-anim=page]>.w:not(:has(.hero)){animation:pgIn .55s var(--ease) backwards}
#app[data-anim=page]>footer,#app[data-anim=page] footer{animation:fade .8s .3s backwards}
#app[data-anim=page] .hero h1{animation:up .9s var(--ease) backwards}
#app[data-anim=page] .hero p.l{animation:up .9s var(--ease) .12s backwards}
#app[data-anim=page] .hero .acts{animation:up .9s var(--ease) .24s backwards}
#app[data-anim=page] .sb{animation:up .9s var(--ease) .36s backwards}
#app[data-anim=page] .hi img:first-child{animation:zoomIn 1s var(--ease) .1s backwards}
#app[data-anim=page] .hi .i2{animation:zoomIn .9s var(--ease) .5s backwards,float 7s ease-in-out 1.5s infinite}
.hi .i2{box-shadow:0 22px 40px -20px var(--sh)}
.hi img:first-child{box-shadow:0 30px 60px -30px var(--sh)}
.rv.pre{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.pre.in{opacity:1;transform:none}
#app[data-anim=soft] .tabs~*{animation:pgIn .4s var(--ease) backwards}
#app[data-anim=cal] .cal{animation:pgIn .3s var(--ease) backwards}
#app[data-anim=filt] .fl.o{animation:pgIn .3s var(--ease)}
#app[data-anim=grid] .g>*,#app[data-anim=page] .sl .g>*,#app[data-anim=soft] .g>*,.rv.in .g>*{animation:up .6s var(--ease) var(--d,0s) backwards}
#app[data-anim=page] .rc,#app[data-anim=soft] .rc,#app[data-anim=page] .stat,#app[data-anim=soft] .stat,#app[data-anim=grid] .chip,#app[data-anim=page] .chip{animation:up .55s var(--ease) var(--d,0s) backwards}
#app[data-anim=grid] .empty,#app[data-anim=page] .empty{animation:zoomIn .4s var(--ease) backwards}
.hi .i2{animation:float 7s ease-in-out infinite}

/* images: shimmer until loaded, then fade in */
.im img,.gal img,.hi img,.dest img{opacity:0;transition:opacity .6s ease,transform .6s var(--ease)}
.im img.ld,.gal img.ld,.hi img.ld,.dest img.ld{opacity:1}
.im:not(:has(.ld)){background:linear-gradient(100deg,var(--ln) 30%,var(--bg) 50%,var(--ln) 70%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.gal img{transition:opacity .6s ease,transform .6s var(--ease),filter .3s}.gal img:hover{filter:brightness(.92)}

/* cards */
.card{transition:transform .35s var(--ease)}.card:hover{transform:translateY(-4px)}
.card:hover img{transform:scale(1.05)}
.im{box-shadow:0 1px 0 var(--ln)}
.fav{transition:transform .2s var(--ease),color .2s,background .2s;z-index:2}.fav:hover{transform:scale(1.14)}.fav:active{transform:scale(.9)}.fav.on{animation:heart .5s var(--ease);background:#fff}
.im .nv{position:absolute;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#26231f;display:grid;place-items:center;font-size:18px;line-height:1;opacity:0;transform:scale(.85);transition:opacity .2s,transform .2s;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:2}
.im .nv.pv{left:8px}.im .nv.nx{right:8px}.im .nv:hover{transform:scale(1.08)}
.card:hover .nv,.nv:focus-visible{opacity:1;transform:none}
@media(hover:none){.im .nv{display:none}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}.card:hover .dots{opacity:1}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transition:transform .25s,background .25s}.dots i.on{background:#fff;transform:scale(1.3)}
.dest{transition:transform .35s var(--ease),box-shadow .35s}.dest:hover{transform:translateY(-4px);box-shadow:0 20px 34px -20px var(--sh)}.dest:hover img{transform:scale(1.07)}
.dest::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.6));pointer-events:none}.dest span{z-index:1}
.chip{transition:border-color .2s,transform .2s,background .2s}.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.rc{transition:transform .25s var(--ease),box-shadow .25s}.rc:hover{transform:translateY(-2px);box-shadow:0 16px 30px -22px var(--sh)}
.stat{transition:transform .25s var(--ease),box-shadow .25s}.stat:hover{transform:translateY(-2px);box-shadow:0 16px 30px -22px var(--sh)}

/* search bar (pill) */
.sb{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:0;background:var(--sf);border:1px solid var(--ln);border-radius:99px;margin:36px 0 8px;box-shadow:0 18px 40px -22px var(--sh);padding:6px;align-items:stretch;position:relative}
.sb .fld{background:transparent;padding:10px 22px;border-radius:99px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;text-align:left;border:0;transition:background .2s,box-shadow .25s;position:relative;justify-content:center;min-width:0;cursor:pointer}
.sb .fld:hover{background:var(--bg)}
.sb .fld:focus-within,.sb .fld.act{background:var(--bg);box-shadow:0 0 0 1px var(--ln),0 10px 22px -12px var(--sh)}
.sb .fld+.fld::before{content:"";position:absolute;left:0;top:24%;bottom:24%;width:1px;background:var(--ln);transition:opacity .2s}
.sb .fld:hover::before,.sb .fld:hover+.fld::before,.sb .fld.act::before,.sb .fld.act+.fld::before,.sb .fld:focus-within::before,.sb .fld:focus-within+.fld::before{opacity:0}
.sb input{border:0;background:transparent;font-size:15px;padding:2px 0;min-width:0;width:100%;outline:none;color:var(--ink)}
.sb input::placeholder{color:var(--mu)}
